name: Telecom RAG CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify FastAPI Import
      run: |
        python -c "import fastapi"

    - name: Verify Chroma Import
      run: |
        python -c "import chromadb"

    - name: Verify App Imports
      run: |
        python -c "from app.retrieve import search"

    - name: Build Docker Image
      run: |
        docker build -t telecom-rag .